name: iOS build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for Xcode project
        shell: bash
        run: |
          echo "Searching for Xcode project..."
          find . -maxdepth 4 \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) | sort

      - name: Build iOS app
        if: ${{ hashFiles('**/*.xcodeproj/project.pbxproj') != '' }}
        shell: bash
        run: |
          PROJECT_PATH=$(find . -maxdepth 4 -name "*.xcodeproj" | head -n 1)
          SCHEME_NAME=$(xcodebuild -list -project "$PROJECT_PATH" 2>/dev/null | awk '/Schemes:/{flag=1; next} flag && NF {print; exit}')

          if [ -z "$SCHEME_NAME" ]; then
            SCHEME_NAME="SystemLogsApp"
          fi

          echo "Using project: $PROJECT_PATH"
          echo "Using scheme: $SCHEME_NAME"

          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME_NAME" \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            build

      - name: No Xcode project found
        if: ${{ hashFiles('**/*.xcodeproj/project.pbxproj') == '' }}
        shell: bash
        run: |
          echo "No Xcode project found yet."
          echo "Add .xcodeproj or .xcworkspace to enable build."
